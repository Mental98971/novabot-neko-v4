name: NovaBot Neko Runner

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd novabot
          pip install --no-cache-dir -r requirements.txt

      - name: Check Secrets & Start Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd novabot
          echo "Checking if BOT_TOKEN is provided..."
          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: BOT_TOKEN secret is missing or empty!"
            exit 1
          fi
          echo "BOT_TOKEN is present. Starting bot..."
          PYTHONPATH=. timeout 20700 python -m bot
